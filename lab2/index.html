<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 2 - LLM with Guardrails</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; background: #f6f7f9; color: #1d1f23; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: #5b616b; margin-top: 0; }
  .card { background: #fff; border: 1px solid #dde1e6; border-radius: 10px; padding: 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; margin: 12px 0 4px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  label { font-size: .85rem; color: #5b616b; }
  textarea, button { font: inherit; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; padding: 10px; border: 1px solid #c8cdd3; border-radius: 8px; }
  button { margin-top: 10px; padding: 9px 18px; background: #2459d6; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #9aa8c7; cursor: wait; }
  .result { margin-top: 16px; border-radius: 10px; padding: 14px 16px; border-left: 6px solid; display: none; }
  .badge { display: inline-block; font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 999px; color: #fff; }
  .answer { white-space: pre-wrap; line-height: 1.5; margin-top: 10px; }
  .why { font-size: .8rem; color: #5b616b; margin-top: 10px; }
  .GREEN  { background: #e9f7ec; border-color: #1e8e3e; } .GREEN .badge  { background: #1e8e3e; }
  .ORANGE { background: #fff4e5; border-color: #e37400; } .ORANGE .badge { background: #e37400; }
  .RED    { background: #fdecea; border-color: #c5221f; } .RED .badge    { background: #c5221f; }
  .err { color: #b3261e; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Course Assistant with Guardrails</h1>
  <p class="sub">Topics: Computer Science, Linux, Cybersecurity &middot; Model: llama3.2:1b (Ollama, CPU only)</p>
  <div class="card">
    <div class="legend">
      <span><span class="dot" style="background:#1e8e3e"></span>Green: course topic</span>
      <span><span class="dot" style="background:#e37400"></span>Orange: related, not main topic</span>
      <span><span class="dot" style="background:#c5221f"></span>Red: unsafe or not appropriate</span>
    </div>
    <label for="q">Your question</label>
    <textarea id="q" placeholder="Example: How does a firewall protect a Linux server?"></textarea>
    <button id="ask">Ask</button>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <span class="badge" id="badge"></span>
      <div class="answer" id="answer"></div>
      <div class="why" id="why"></div>
    </div>
  </div>
<script>
const LABELS = { GREEN: 'GREEN - Course topic', ORANGE: 'ORANGE - Related topic', RED: 'RED - Blocked' };
const btn = document.getElementById('ask');
const box = document.getElementById('result');
const err = document.getElementById('err');

async function ask() {
  const question = document.getElementById('q').value.trim();
  if (!question) return;
  btn.disabled = true; err.textContent = ''; box.style.display = 'none';
  btn.textContent = 'Checking and thinking...';
  const t0 = performance.now();
  try {
    const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }) });
    const d = await r.json();
    if (d.error) { err.textContent = d.error; }
    else {
      box.className = 'result ' + d.color;
      document.getElementById('badge').textContent = LABELS[d.color];
      document.getElementById('answer').textContent = d.answer;
      document.getElementById('why').textContent =
        `Why: ${d.reason} | Decided by: ${d.layer === 'rules' ? 'Layer 1 (rules)' : 'Layer 2 (AI classifier)'} | Time: ${((performance.now() - t0) / 1000).toFixed(1)} s`;
      box.style.display = 'block';
    }
  } catch (e) { err.textContent = 'Request failed: ' + e; }
  btn.disabled = false; btn.textContent = 'Ask';
}
btn.addEventListener('click', ask);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask(); });
</script>
</body>
</html>
